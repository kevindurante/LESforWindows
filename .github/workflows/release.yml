name: Create Release

on:
  push:
    tags:
      - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

jobs:
  build:
    runs-on: windows-latest
    steps:
    - name: Clone GitHub repository
      uses: actions/checkout@v4
    - name: Download and extract AutoHotKey
      run: |
        Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip" -OutFile ahk.zip
        Expand-Archive -Path ahk.zip -DestinationPath .\AutoHotKey\ -Force
        Get-ChildItem .\AutoHotKey\Compiler
    - name: Run AutoHotKey compiler to generate binary
      run: |
        Start-Process -FilePath ".\AutoHotKey\Compiler\Ahk2Exe.exe" -ArgumentList '/in','LiveEnhancementSuite.ahk','/out','Live Enhancement Suite.exe','/icon','resources\blueico.ico' -Wait -NoNewWindow
        if (-not (Test-Path "Live Enhancement Suite.exe")) { throw "Ahk2Exe did not produce the exe" }
    - name: Package portable executable with checksum
      run: |
        CertUtil -hashfile "Live Enhancement Suite.exe" SHA256 | Select -SkipLast 1 >> chksm
        (Get-Content chksm) -join ' ' >> CHECKSUM.txt
        Compress-Archive -LiteralPath "Live Enhancement Suite.exe", CHECKSUM.txt -DestinationPath .\LiveEnhancementSuitePortable-x64.zip
    - name: Upload portable version to release
      uses: svenstaro/upload-release-action@v1-release
      with:
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        file: .\LiveEnhancementSuitePortable-x64.zip
        asset_name: LiveEnhancementSuitePortable-x64.zip
        tag: ${{ github.ref }}
        overwrite: true
  
