name: Local build (self-hosted)

# Builds "Live Enhancement Suite.exe" on a self-hosted runner installed on
# your own PC and drops it straight into your LES install folder
# (%USERPROFILE%\Documents\LES by default), replacing the running copy.
#
# Setup (one time):
#   1. Repo Settings -> Actions -> General: enable Actions for this repo.
#   2. Repo Settings -> Actions -> Runners -> "New self-hosted runner",
#      pick Windows, and follow the shown commands on your PC. Run
#      ./run.cmd from your own user account (NOT as a service under a
#      different account) so Documents resolves to *your* Documents.
#   3. Make sure AutoHotkey is installed (any standard location). If it
#      isn't, this workflow downloads a pinned copy of the compiler.
#
# After that, every push to the branch below rebuilds and swaps the exe.
# You can also trigger it by hand from the Actions tab ("Run workflow"),
# where you can override the destination folder and whether to relaunch.

on:
  push:
    branches:
      - claude/search-down-arrow-keystroke-47wcys
      # add "develop" here once the fix is merged if you want it to build from there too
  workflow_dispatch:
    inputs:
      destination:
        description: "Folder to copy the built exe into (blank = Documents\\LES)"
        required: false
        default: ""
      relaunch:
        description: "Relaunch LES after copying"
        type: boolean
        required: false
        default: true

jobs:
  build:
    runs-on: self-hosted   # your Windows PC's runner
    steps:
      - name: Clone GitHub repository
        uses: actions/checkout@v4

      - name: Locate or download the Ahk2Exe compiler
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "C:\Program Files\AutoHotkey\Compiler\Ahk2Exe.exe",
            "C:\Program Files (x86)\AutoHotkey\Compiler\Ahk2Exe.exe"
          )
          $compiler = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $compiler) {
            Write-Host "AutoHotkey not found locally; downloading a pinned copy..."
            $zip  = Join-Path $env:RUNNER_TEMP "ahk.zip"
            $dest = Join-Path $env:RUNNER_TEMP "ahk"
            Invoke-WebRequest -Uri "https://github.com/AutoHotkey/AutoHotkey/releases/download/v1.1.37.02/AutoHotkey_1.1.37.02.zip" -OutFile $zip
            Expand-Archive -Path $zip -DestinationPath $dest -Force
            $compiler = Join-Path $dest "Compiler\Ahk2Exe.exe"
          }
          if (-not (Test-Path $compiler)) { throw "Could not find or obtain Ahk2Exe.exe" }
          Write-Host "Using compiler: $compiler"
          "AHK2EXE=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Compile LiveEnhancementSuite.ahk
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          Start-Process -FilePath "$env:AHK2EXE" -ArgumentList '/in','LiveEnhancementSuite.ahk','/out','Live Enhancement Suite.exe','/icon','resources\blueico.ico' -Wait -NoNewWindow
          if (-not (Test-Path "Live Enhancement Suite.exe")) { throw "Compilation did not produce the exe" }
          Write-Host "Compiled Live Enhancement Suite.exe"

      - name: Copy build into your LES folder
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $dest = "${{ github.event.inputs.destination }}"
          if ([string]::IsNullOrWhiteSpace($dest)) {
            $dest = Join-Path ([Environment]::GetFolderPath('MyDocuments')) "LES"
          }
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          $target = Join-Path $dest "Live Enhancement Suite.exe"

          # Windows won't overwrite a running exe, so stop it first.
          Get-Process -Name "Live Enhancement Suite" -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Milliseconds 500

          Copy-Item "Live Enhancement Suite.exe" -Destination $target -Force
          Write-Host "Copied build to $target"

          # Relaunch unless explicitly disabled (push events default to relaunching).
          if ("${{ github.event.inputs.relaunch }}" -ne "false") {
            Start-Process -FilePath $target
            Write-Host "Relaunched LES."
          }
